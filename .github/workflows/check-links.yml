name: Check links

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 1 * *'

permissions:
  contents: write

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check sites and rebuild catalog
        shell: pwsh
        run: ./scripts/check_links.ps1

      - name: Commit updated statuses
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/link-status.json README.md catalog assets/status
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: update link statuses"
          git push
